name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  advisory-schemas:
    name: ADV-1 schemas and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pytest jsonschema
      - run: python tools/validate.py
      - run: python -m pytest -q tests/test_advisory.py

  roundtable-engine:
    name: Jac roundtable engine
    runs-on: ubuntu-latest
    env:
      # Lets jac check/test resolve `roundtable.*` (see README).
      PYTHONPATH: jac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Not "3.x": jaclang and byllm need >= 3.12, and byllm's dependency
          # fastuuid ships wheels only up to a given Python, so the newest
          # release can force a Rust source build. Pinned for reproducibility.
          python-version: "3.12"
      - run: pip install -r jac/requirements.txt
      - name: Type-check the engine and the CLI
        # Separately: given together, jac check treats one Roster type as two.
        run: |
          jac check jac/roundtable
          jac check jac/roundtable_cli.jac
      - name: Native Jac tests (vote rule, clipping)
        run: |
          jac test jac/roundtable/tally.jac
          jac test jac/roundtable/digest.jac
      - name: End-to-end tests against scripted models (no network, no API keys)
        run: python -m pytest -q tests/test_roundtable_engine.py
